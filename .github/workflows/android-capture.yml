name: Android capture APK

on:
  push:
    branches: [main, "feat/**", "ci/**", "fix/**", "perf/**", "rebuild/**"]
    paths:
      - "android-capture/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app.js"
      - "test-capture-handoff.mjs"
      - ".github/workflows/android-capture.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "android-capture/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "app.js"
      - "test-capture-handoff.mjs"
      - ".github/workflows/android-capture.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -d "$ANDROID_HOME/platforms/android-35"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Verify actual Android entrypoint contracts
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE=android-capture/src/main/java/com/newwonwoo/downloader/capture/CaptureActivity.java
          SERVICE=android-capture/src/main/java/com/newwonwoo/downloader/capture/HlsDownloadService.java
          MANIFEST=android-capture/src/main/AndroidManifest.xml
          node test-capture-handoff.mjs
          grep -Fq 'android:name=".CaptureActivity"' "$MANIFEST"
          grep -Fq 'android.intent.action.SEND' "$MANIFEST"
          grep -Fq 'android:mimeType="text/plain"' "$MANIFEST"
          grep -Fq 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
          grep -Fq 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' "$MANIFEST"
          grep -Fq 'android:foregroundServiceType="dataSync"' "$MANIFEST"
          grep -Fq 'requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}' "$CAPTURE"
          grep -Fq 'shouldInterceptRequest' "$CAPTURE"
          grep -Fq 'ServiceWorkerController' "$CAPTURE"
          grep -Fq '@JavascriptInterface' "$CAPTURE"
          grep -Fq 'setAllowFileAccess(false)' "$CAPTURE"
          grep -Fq 'startForegroundService(download)' "$CAPTURE"
          grep -Fq 'startForeground(NOTIFICATION_ID' "$SERVICE"
          grep -Fq 'NETWORK_WORKERS = 12' "$SERVICE"
          grep -Fq 'MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4' "$SERVICE"
          grep -Fq 'MediaStore.Video.Media.RELATIVE_PATH' "$SERVICE"

      - name: Build debug APK
        run: gradle :android-capture:assembleDebug --stacktrace

      - name: Verify built APK manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=android-capture/build/outputs/apk/debug/android-capture-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/manifest.xml
          grep -Fq 'com.newwonwoo.downloader.capture.CaptureActivity' /tmp/manifest.xml
          grep -Fq 'android.intent.action.SEND' /tmp/manifest.xml
          grep -Fq 'android.permission.POST_NOTIFICATIONS' /tmp/manifest.xml
          grep -Fq 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' /tmp/manifest.xml
          grep -Fq 'com.newwonwoo.downloader.capture.HlsDownloadService' /tmp/manifest.xml
          ls -lh "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: video-save-tool-debug-apk
          path: android-capture/build/outputs/apk/debug/android-capture-debug.apk
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: video-save-tool-debug-apk
          path: /tmp/apk

      - name: Enable KVM
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm unavailable; emulator runner will fall back to software acceleration'
          fi

      - name: Install emulator tooling
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Android 15 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/android-runtime-smoke.sh

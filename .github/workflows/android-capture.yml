name: Android capture APK

on:
  push:
    branches: [main, "feat/**", "ci/**", "fix/**", "perf/**", "rebuild/**"]
    paths:
      - "android-capture/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-capture.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "android-capture/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android-capture.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Verify rebuilt Android contracts
        shell: bash
        run: |
          set -euo pipefail
          CAPTURE=android-capture/src/main/java/com/newwonwoo/downloader/capture/CaptureActivity.java
          SERVICE=android-capture/src/main/java/com/newwonwoo/downloader/capture/HlsDownloadService.java
          MANIFEST=android-capture/src/main/AndroidManifest.xml
          GRADLE=android-capture/build.gradle.kts
          DEV_KEY=android-capture/dev-signing-keystore.b64
          test -f "$CAPTURE"
          test -f "$SERVICE"
          test -s "$DEV_KEY"
          test ! -f android-capture/src/main/java/com/newwonwoo/downloader/capture/MainActivity.java
          grep -Fq 'android:name=".CaptureActivity"' "$MANIFEST"
          grep -Fq 'android.intent.action.SEND' "$MANIFEST"
          grep -Fq 'android.permission.POST_NOTIFICATIONS' "$MANIFEST"
          grep -Fq 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' "$MANIFEST"
          grep -Fq 'android:foregroundServiceType="dataSync"' "$MANIFEST"
          grep -Fq 'requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}' "$CAPTURE"
          grep -Fq 'captureCandidate(request.getUrl().toString(), request.getRequestHeaders())' "$CAPTURE"
          grep -Fq 'main frame load failed code=' "$CAPTURE"
          grep -Fq 'BuildConfig.BUILD_SHA' "$CAPTURE"
          grep -Fq 'format=hls' "$CAPTURE"
          grep -Fq 'softPrimePlayer()' "$CAPTURE"
          grep -Fq 'EXTRA_REFERER' "$CAPTURE"
          grep -Fq 'startForeground(NOTIFICATION_ID' "$SERVICE"
          grep -Fq 'START_REDELIVER_INTENT' "$SERVICE"
          grep -Fq 'stream validated segments=' "$SERVICE"
          grep -Fq 'NETWORK_WORKERS = 12' "$SERVICE"
          grep -Fq 'joinFragmentedMp4' "$SERVICE"
          grep -Fq 'safeExternalHttps' "$SERVICE"
          grep -Fq 'MediaStore.Video.Media.RELATIVE_PATH' "$SERVICE"
          grep -Fq 'buildConfigField("String", "BUILD_SHA"' "$GRADLE"
          grep -Fq 'dev-signing-keystore.b64' "$GRADLE"
          base64 -d "$DEV_KEY" > /tmp/video-save-dev.jks
          keytool -list -keystore /tmp/video-save-dev.jks -storepass android -alias videosave-dev >/dev/null
      - name: Run Android JVM tests
        run: gradle :android-capture:testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle :android-capture:assembleDebug --stacktrace
      - name: Verify built APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android-capture/build/outputs/apk/debug/android-capture-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/certs.txt
          NORMALIZED_CERT=$(tr '[:upper:]' '[:lower:]' < /tmp/certs.txt | tr -d ':')
          grep -Fq 'bfe7c62d3af441810c0a42d09af4b70b606a9722fe27b631e5904721d569aa4d' <<<"$NORMALIZED_CERT"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/manifest.xml
          grep -Fq 'com.newwonwoo.downloader.capture.CaptureActivity' /tmp/manifest.xml
          grep -Fq 'android.intent.action.SEND' /tmp/manifest.xml
          grep -Fq 'android.permission.POST_NOTIFICATIONS' /tmp/manifest.xml
          grep -Fq 'com.newwonwoo.downloader.capture.HlsDownloadService' /tmp/manifest.xml
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: video-save-tool-v2-debug-apk
          path: android-capture/build/outputs/apk/debug/android-capture-debug.apk
          if-no-files-found: error
          retention-days: 14

  runtime-smoke:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: video-save-tool-v2-debug-apk
          path: /tmp/apk
      - name: Enable KVM when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo '/dev/kvm unavailable; emulator will use software acceleration'
          fi
      - name: Install emulator tooling
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"
      - name: Android 15 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          script: bash .github/scripts/android-runtime-smoke.sh
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-runtime-diagnostics
          path: |
            runtime-before.png
            runtime-after.png
            runtime-window.xml
            runtime-logcat.txt
          if-no-files-found: warn
          retention-days: 7

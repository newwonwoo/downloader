name: Android share companion
on:
  push:
    branches: ["feat/android-share-companion"]
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "android-companion/**"
      - ".github/workflows/android-companion.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle -p android-companion :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s android-companion/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android-companion/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: video-save-tool-android
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: Render production smoke

on:
  push:
    branches: [main, "fix/**", "test/**"]
    paths:
      - "index.html"
      - "app.js"
      - "gateway.js"
      - "native-download.js"
      - "file-job-client.js"
      - "sw.js"
      - "downloader-worker/**"
      - ".github/workflows/render-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEB_URL: https://downloader-web-1gqu.onrender.com
      WORKER_URL: https://downloader-worker-brm7.onrender.com
      PAGE_URL: https://njavtv.com/dm890/ko/102816-005
      STREAM_URL: https://surrit.com/fee1f896-c34b-4caa-a712-0e8241e38cfc/640x360/video.m3u8
    steps:
      - uses: actions/checkout@v4

      - name: Verify single-path frontend locally
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check gateway.js
          node --check file-job-client.js
          node --check native-download.js
          node --check sw.js
          grep -q "FRONTEND_VERSION = 'single-path-v1'" app.js
          grep -q 'warmDownloaderWorker' gateway.js
          grep -q 'file-job-client.js' index.html
          if grep -q 'mux.js' index.html; then
            echo 'legacy mux.js must not be loaded'
            exit 1
          fi
          if grep -q 'native-download.js' index.html; then
            echo 'legacy native-download.js must not be loaded'
            exit 1
          fi
          if grep -q 'backgroundFetch' app.js; then
            echo 'legacy Background Fetch code returned to app.js'
            exit 1
          fi
          grep -q 'registration.unregister' sw.js

      - name: Verify standalone web and worker wiring
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            ready=0
            for attempt in $(seq 1 60); do
              if curl -fsS --max-time 15 "$WEB_URL/app.js" -o /tmp/app.js && \
                 grep -q "FRONTEND_VERSION = 'single-path-v1'" /tmp/app.js; then
                ready=1
                break
              fi
              echo "WEB_ROLLOUT_WAIT attempt=$attempt"
              sleep 2
            done
            test "$ready" = "1"
          fi

          curl -fsS --max-time 15 "$WEB_URL/" -o /tmp/index.html
          grep -q '영상 저장 도구' /tmp/index.html
          curl -fsS --max-time 15 "$WEB_URL/gateway.js" -o /tmp/gateway.js
          grep -q 'downloader-worker-brm7.onrender.com' /tmp/gateway.js

          status=000
          for attempt in $(seq 1 60); do
            status=$(curl -sS --max-time 15 -D /tmp/cors.txt -o /tmp/health.json \
              -H "Origin: $WEB_URL" -w '%{http_code}' "$WORKER_URL/health" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            echo "WORKER_WAKE_WAIT attempt=$attempt status=$status"
            sleep 2
          done
          test "$status" = "200"
          cat /tmp/health.json
          grep -qi '^access-control-allow-origin: https://downloader-web-1gqu.onrender.com' /tmp/cors.txt
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json'))
          assert data['ok'] is True
          assert data['mode'] == 'native-mobile-stream-v5-files'
          PY

          status=$(curl -sS --max-time 15 -o /tmp/jobs.json -w '%{http_code}' \
            -H 'content-type: application/json' -H "Origin: $WEB_URL" -d '{}' "$WORKER_URL/jobs")
          cat /tmp/jobs.json
          test "$status" = "422"

      - name: Verify page resolver after main rollout
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          status=000
          for attempt in $(seq 1 60); do
            status=$(curl -sS --max-time 15 -o /tmp/resolve.json -w '%{http_code}' \
              -H 'content-type: application/json' -H "Origin: $WEB_URL" \
              -d "{\"url\":\"$PAGE_URL\"}" "$WORKER_URL/resolve" || true)
            cat /tmp/resolve.json || true
            if [ "$status" = "200" ]; then
              break
            fi
            echo "RESOLVER_WAIT attempt=$attempt status=$status"
            sleep 2
          done
          test "$status" = "200"
          python - <<'PY'
          import json
          data=json.load(open('/tmp/resolve.json'))
          assert data['ok'] is True
          assert data['streams']
          assert any(x.get('quality') == '640x360' for x in data['streams'])
          PY

      - name: Verify real MP4 output
        shell: bash
        run: |
          set -euo pipefail
          set +e
          curl -fSs --max-time 15 \
            --get "$WORKER_URL/download" \
            --data-urlencode "stream_url=$STREAM_URL" \
            --data-urlencode 'title=migrated-production-smoke' \
            --data-urlencode 'quality=640x360' \
            -o /tmp/native.mp4
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 28 ]; then
            exit "$rc"
          fi
          bytes=$(stat -c %s /tmp/native.mp4 2>/dev/null || echo 0)
          echo "MP4_PREFIX_BYTES=$bytes"
          test "$bytes" -gt 32768
          python - <<'PY'
          from pathlib import Path
          data=Path('/tmp/native.mp4').read_bytes()[:256]
          assert b'ftyp' in data, data[:32].hex()
          print('MP4_FTYP_OK')
          PY

name: Render production smoke
on:
  push:
    branches: [main, "fix/**", "test/**", "chore/**"]
    paths: ["index.html","styles.css","app.js","gateway.js","file-job-client.js","sw.js","test-browser-handoff.mjs","downloader-worker/**","README.md",".github/workflows/render-production-smoke.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WEB_URL: https://downloader-web-1gqu.onrender.com
      WORKER_URL: https://downloader-worker-brm7.onrender.com
      PAGE_URL: https://njavtv.com/dm890/ko/102816-005
      STREAM_URL: https://surrit.com/fee1f896-c34b-4caa-a712-0e8241e38cfc/640x360/video.m3u8
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository and mobile contracts locally
        shell: bash
        run: |
          set -euo pipefail
          test ! -d api; test ! -e package.json; test ! -e requirements.txt; test ! -e vercel.json
          node --check app.js; node --check gateway.js; node --check file-job-client.js; node test-browser-handoff.mjs
          grep -Fq "FRONTEND_VERSION = 'mobile-entry-v1'" app.js
          grep -Fq 'pasteAnalyzeButton' index.html
          grep -Fq 'navigator.clipboard?.readText' app.js
          grep -Fq "params.get('url')" app.js
          grep -Fq 'MAX_RECOVERY_ATTEMPTS = 2' file-job-client.js
          grep -Fq "DOWNLOAD_WORKERS = max(1, int(os.getenv('DOWNLOAD_WORKERS', '8')))" downloader-worker/app.py
          grep -Fq "MAX_QUEUED_JOBS = max(0, int(os.getenv('MAX_QUEUED_FILE_JOBS', '2')))" downloader-worker/file_jobs.py
      - name: Verify deployed web and exact worker
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 15 "$WEB_URL/app.js" -o /tmp/app.js && curl -fsS --max-time 15 "$WEB_URL/" -o /tmp/index.html && grep -Fq "FRONTEND_VERSION = 'mobile-entry-v1'" /tmp/app.js && grep -Fq '복사한 주소로 영상 찾기' /tmp/index.html; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          status=000; worker_sha=''
          for attempt in $(seq 1 90); do
            status=$(curl -sS --max-time 15 -D /tmp/h -o /tmp/health -H "Origin: $WEB_URL" -w '%{http_code}' "$WORKER_URL/health" || true)
            worker_sha=$(tr -d '\r' </tmp/h 2>/dev/null | sed -n 's/^x-worker-git-commit: //Ip' | tail -n1)
            if [ "$status" = 200 ] && [ "$worker_sha" = "$GITHUB_SHA" ]; then break; fi
            sleep 2
          done
          test "$status" = 200; test "$worker_sha" = "$GITHUB_SHA"
          grep -qi '^access-control-allow-origin: https://downloader-web-1gqu.onrender.com' /tmp/h
      - name: Verify resolver and real MP4
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 -H 'content-type: application/json' -H "Origin: $WEB_URL" -d "{\"url\":\"$PAGE_URL\"}" "$WORKER_URL/resolve" -o /tmp/resolve.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/resolve.json')); assert d['ok'] and d['streams']
          PY
          set +e
          curl -fSs --max-time 30 --get "$WORKER_URL/download" --data-urlencode "stream_url=$STREAM_URL" --data-urlencode 'title=mobile-entry-smoke' --data-urlencode 'quality=640x360' -o /tmp/native.mp4
          rc=$?; set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 28 ]; then exit "$rc"; fi
          test "$(stat -c %s /tmp/native.mp4 2>/dev/null || echo 0)" -gt 32768
          python - <<'PY'
          from pathlib import Path
          assert b'ftyp' in Path('/tmp/native.mp4').read_bytes()[:256]
          PY

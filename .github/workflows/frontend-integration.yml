name: Downloader frontend integration
on:
  push:
    branches: [main, "feat/**", "fix/**", "perf/**", "test/**"]
    paths: ["index.html","styles.css","app.js","gateway.js","file-job-client.js","sw.js","test-browser-handoff.mjs",".github/workflows/frontend-integration.yml"]
  pull_request:
    paths: ["index.html","styles.css","app.js","gateway.js","file-job-client.js","sw.js","test-browser-handoff.mjs",".github/workflows/frontend-integration.yml"]
permissions: {contents: read}
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate Samsung mobile entry and existing download flow
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check gateway.js
          node --check file-job-client.js
          node --check sw.js
          node test-browser-handoff.mjs
          grep -Fq "FRONTEND_VERSION = 'mobile-entry-v2'" app.js
          grep -Fq 'pasteAnalyzeButton' index.html
          grep -Fq '복사한 영상 바로 찾기' index.html
          grep -Fq 'navigator.clipboard?.readText' app.js
          grep -Fq 'window.isSecureContext' app.js
          grep -Fq 'extractPageUrl' app.js
          grep -Fq "params.get('url')" app.js
          grep -Fq 'manualEntry' index.html
          grep -Fq 'file-job-client.js' index.html
          grep -Fq 'MAX_RECOVERY_ATTEMPTS = 2' file-job-client.js
          grep -Fq 'recoverMissingJob' file-job-client.js
          grep -Fq 'browser-handoff-v2' app.js
          grep -Fq 'HLS_IMPORT_HOSTS' app.js
          if grep -Fq '최초 1회 설정' index.html; then echo 'bookmark setup must not return to primary UX'; exit 1; fi
          if grep -Fq 'value="https://njavtv.com/' index.html; then echo 'demo URL must not ship as user input'; exit 1; fi

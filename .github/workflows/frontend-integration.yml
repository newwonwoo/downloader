name: Downloader frontend integration

on:
  push:
    branches: [main, "feat/**", "fix/**", "perf/**"]
    paths:
      - "index.html"
      - "app.js"
      - "gateway.js"
      - "file-job-client.js"
      - "sw.js"
      - ".github/workflows/frontend-integration.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "gateway.js"
      - "file-job-client.js"
      - "sw.js"
      - ".github/workflows/frontend-integration.yml"

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate browser scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check gateway.js
          node --check file-job-client.js
          node --check sw.js
          grep -Fq 'file-job-client.js' index.html
          grep -Fq 'startedAt: Date.now()' file-job-client.js
          grep -Fq 'MB/s' file-job-client.js
          grep -Fq '남음' file-job-client.js
          grep -Fq 'helperPanel' index.html
          grep -Fq 'browser-handoff-v2' app.js
          grep -Fq 'window.hls' app.js
          grep -Fq 'v._hls' app.js
          grep -Fq "performance.getEntriesByType('resource')" app.js
          grep -Fq 'HLS_IMPORT_HOSTS' app.js
          if grep -Fq 'fee1f896-c34b-4caa-a712-0e8241e38cfc' app.js; then
            echo 'Generic browser handoff must not depend on the verified sample UUID'
            exit 1
          fi
